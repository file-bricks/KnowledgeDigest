name: KnowledgeDigest tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest tests -ra -v

      - name: Check CLI entrypoint
        run: |
          python -m KnowledgeDigest --help
          knowledgedigest --help

  package-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build PySide6
          python -m build --wheel --sdist --outdir "$RUNNER_TEMP/dist"

      - name: Verify package icon and source documentation links
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import tarfile
          from urllib.parse import unquote, urlsplit
          import zipfile

          dist = Path(os.environ["RUNNER_TEMP"]) / "dist"
          wheel = next(dist.glob("*.whl"))
          sdist = next(dist.glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              assert any(name.endswith("/KnowledgeDigest.ico") for name in archive.namelist())
          with tarfile.open(sdist, "r:gz") as archive:
              names = set(archive.getnames())
              root = next(name.split("/", 1)[0] for name in names if name.endswith("/PKG-INFO"))
              required = [
                  "ARCHITECTURE.md", "CHANGELOG.md", "LICENSE", "MARKETING-LOG.txt", "NOTICE",
                  "README.md", "README_de.md", "SECURITY.md", "SMOKE-CHECKS.md",
                  "THIRD_PARTY_LICENSES.md", "llms.txt", "assets/banner.png", "assets/banner.svg",
                  ".github/workflows/tests.yml", "tests/package_smoke.py", "tests/test_metadata.py",
                  "tests/test_no_agpl.py", "tests/test_packaging.py", "KnowledgeDigest.ico",
              ]
              missing = [path for path in required if f"{root}/{path}" not in names]
              assert not missing, f"source archive is missing documented files: {missing}"

              link_pattern = re.compile(r"!?\[[^\]]*\]\(([^\s)]+)|<img\b[^>]*?\bsrc=[\"']([^\"']+)", re.I)
              for readme in ("README.md", "README_de.md"):
                  content = archive.extractfile(f"{root}/{readme}").read().decode("utf-8")
                  for markdown_link, image_src in link_pattern.findall(content):
                      link = markdown_link or image_src
                      parsed = urlsplit(link)
                      if parsed.scheme or parsed.netloc or not parsed.path:
                          continue
                      target = Path(unquote(parsed.path).replace("/", os.sep))
                      member = f"{root}/{target.as_posix()}"
                      assert member in names, f"{readme} links to missing source archive member: {link}"
          PY

      - name: Install and smoke-test wheel
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-target"
          wheel="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-target" "$wheel"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel-target" python -m KnowledgeDigest --help
          PYTHONPATH="$RUNNER_TEMP/wheel-target" python "$GITHUB_WORKSPACE/tests/package_smoke.py"

      - name: Install and smoke-test source distribution
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p "$RUNNER_TEMP/sdist-target"
          sdist="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python -m pip install --no-deps --target "$RUNNER_TEMP/sdist-target" "$sdist"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/sdist-target" python -m KnowledgeDigest --help
          PYTHONPATH="$RUNNER_TEMP/sdist-target" python "$GITHUB_WORKSPACE/tests/package_smoke.py"
