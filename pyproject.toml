[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgedigest"
version = "0.4.0"
description = "Portable local knowledge database with FTS5 search, chunking, desktop GUI, and web viewer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [
  { name = "Lukas Geiger" }
]
keywords = [
  "knowledge-base",
  "fts5",
  "sqlite",
  "document-search",
  "local-first",
  "offline-first",
  "document-indexing",
  "document-processing",
  "pdf-indexer",
  "summarization",
  "privacy-first",
  "zero-egress",
  "desktop-app",
  "pyside6",
  "python",
  "ai",
  "llm",
  "python-package",
  "file-bricks",
  "open-bricks"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Desktop Environment",
  "Topic :: Text Processing :: Indexing"
]

[project.optional-dependencies]
extract = [
  "pdfplumber>=0.10.0",
  "PyPDF2>=3.0.0",
  "python-docx>=1.0.0",
  "beautifulsoup4>=4.12.0"
]
gui = [
  "PySide6>=6.6.0",
  "pypdfium2>=4.30.0"
]
llm = [
  "anthropic>=0.79.0",
  "google-genai>=1.0.0"
]
test = [
  "pytest>=8.0.0"
]
all = [
  "pdfplumber>=0.10.0",
  "PyPDF2>=3.0.0",
  "python-docx>=1.0.0",
  "beautifulsoup4>=4.12.0",
  "PySide6>=6.6.0",
  "pypdfium2>=4.30.0",
  "anthropic>=0.79.0",
  "google-genai>=1.0.0",
  "pytest>=8.0.0"
]

[project.urls]
Homepage = "https://github.com/file-bricks/knowledgedigest"
Repository = "https://github.com/file-bricks/knowledgedigest"
Issues = "https://github.com/file-bricks/knowledgedigest/issues"
"Bug Tracker" = "https://github.com/file-bricks/knowledgedigest/issues"
Documentation = "https://github.com/file-bricks/knowledgedigest/blob/main/README.md"
Architecture = "https://github.com/file-bricks/knowledgedigest/blob/main/ARCHITECTURE.md"
Changelog = "https://github.com/file-bricks/knowledgedigest/blob/main/CHANGELOG.md"
Security = "https://github.com/file-bricks/knowledgedigest/blob/main/SECURITY.md"
Notice = "https://github.com/file-bricks/knowledgedigest/blob/main/NOTICE"
"Third-Party Licenses" = "https://github.com/file-bricks/knowledgedigest/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/file-bricks/knowledgedigest/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/file-bricks/knowledgedigest/blob/main/llms.txt"
"Parent Organization" = "https://github.com/file-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.scripts]
knowledgedigest = "KnowledgeDigest.digest:main"

[tool.setuptools]
packages = [
  "KnowledgeDigest",
  "KnowledgeDigest.gui",
  "KnowledgeDigest.gui.dialogs",
  "KnowledgeDigest.gui.panels",
  "KnowledgeDigest.gui.widgets"
]

[tool.setuptools.package-dir]
KnowledgeDigest = "."

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = "."
testpaths = ["tests"]
addopts = "-ra -q --basetemp=.pytest_tmp"
norecursedirs = [".git", ".pytest_cache", ".pytest_tmp", "__pycache__", "build", "dist", ".venv", "venv"]

[tool.ruff]
line-length = 120
target-version = "py310"
